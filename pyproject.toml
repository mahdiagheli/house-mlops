[build-system]
requires=["setuptools>=68","wheel"]
build_backend="setuptools.build_meta"

[project]
name="house-mlops"
version="0.1.0"
description=""
requires-python=">=3.11"
dependencies=[]

[project.optional-dependencies]
dev=["pytest>=8.3","ruff>=0.11","black"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length=100
target-version="py311"

[tool.ruff.lint]
select=["E","F","I"]
