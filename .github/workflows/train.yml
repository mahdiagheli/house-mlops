
name: Model Training

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: Train, Evaluate, and Validate Model
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: make install

      - name: Install MLflow
        run: python -m pip install "mlflow>=3.0,<4.0"

      - name: Train and evaluate model
        run: python -m houseprice_mlops.pipelines.train

      - name: Run model quality gate
        run: python -m houseprice_mlops.evaluation.quality_gate

      
      
      - name: Inspect generated files
        if: always()
        run: |
          echo "Current working directory:"
          pwd

          echo "Repository root:"
          echo "$GITHUB_WORKSPACE"

          echo "Artifacts directory:"
          ls -la "$GITHUB_WORKSPACE/artifacts" || true

          echo "All generated model and metrics files:"
          find "$GITHUB_WORKSPACE" -type f \
            \( -name "baseline_model.joblib" -o -name "metrics.json" \) \
            -not -path "*/.venv/*" 2>/dev/null || true

          echo "Training source path configuration:"
          grep -n -E "PROJECT_ROOT|ARTIFACTS_DIR|model_path|metrics_path" \
            src/houseprice_mlops/pipelines/train.py


      - name: Upload model, metrics, and MLflow tracking data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: house-price-model
          path: |
            artifacts/
          if-no-files-found: error
          retention-days: 7
